[package]
name = "merged-index-col"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
dbsp = { path = "../../../crates/dbsp", features = ["backend-mode"] }
feldera-sqllib = { path = "../../../crates/sqllib" }
feldera-macros = { path = "../../../crates/feldera-macros" }
rkyv = { version = "0.7", default-features = false, features = ["std", "size_64", "validation"] }
size-of = { version = "0.1.7", package = "feldera-size-of" }

[dev-dependencies]
proptest = "1.5.0"
feldera-storage = { path = "../../../crates/storage" }
feldera-types = { path = "../../../crates/feldera-types" }
tempfile = "3"

[profile.dev]
debug = "line-tables-only"
